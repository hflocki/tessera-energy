# Electricity at home with solar: what the solar panels make, what the house uses, what comes from the grid or goes
# back to it, and the day so far. Every field is explained in docs/MANIFEST.md of tessera-plugins.
id: energy_flow
version: 2.0.0
# 0.9: Tone, ui::set_fill and one-line labels; 0.10: ui::text; 0.15: a tile's options of kind entity.
api: "0.15"
icon: solar-power
maintainer: hflocki
license: MIT
stage: beta
topics: [energy, home]
requires:
  esphome: 2026.6.2
boards: any
flash_kb: 16

tiles:
  - id: flow
    name: tile_name
    icon: solar-power
    sizes: { min: 1x1, max: 6x3 }
    # Three circles with icons, six labels, two arrows, the share bar and a line of the day.
    memory: 1400
    example: tile_example
    # The sensors, chosen per tile: the grid's power is the one that matters, every other may stay empty. The app
    # sends their states with the tile's data, and another choice needs no build.
    options:
      - { id: grid, kind: entity, domains: [sensor], attributes: [unit_of_measurement], label: opt_grid,
          hint: opt_grid_hint }
      - { id: invert, kind: toggle, default: false, label: invert, hint: invert_hint }
      - { id: pv, kind: entity, domains: [sensor], attributes: [unit_of_measurement], label: opt_pv, hint: opt_pv_hint }
      - { id: home, kind: entity, domains: [sensor], attributes: [unit_of_measurement], label: opt_home,
          hint: opt_home_hint }
      - { id: coverage, kind: entity, domains: [sensor], attributes: [unit_of_measurement], label: opt_coverage,
          hint: opt_coverage_hint }
      - { id: pv_today, kind: entity, domains: [sensor], attributes: [unit_of_measurement], label: opt_pv_today,
          hint: opt_pv_today_hint }
      - { id: grid_today, kind: entity, domains: [sensor], attributes: [unit_of_measurement], label: opt_grid_today,
          hint: opt_grid_today_hint }
      - { id: forecast, kind: entity, domains: [sensor], attributes: [unit_of_measurement], label: opt_forecast,
          hint: opt_forecast_hint }
      - { id: today, kind: toggle, default: true, label: today, hint: today_hint }

cards:
  # A tap on the tile: the same, large, with the day so far.
  - { id: details, name: card_name, wide: true }
